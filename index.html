<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cours">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Mes cours</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#25221c; --muted:#7a7468; --line:#ddd6c6;
  --ok:#2f8f5b; --ok-bg:#e3f3ea; --err:#c23a2b; --err-bg:#fbe5e1; --warn:#b7791f; --warn-bg:#fbefd2;
  --accent:#25221c; --accent-ink:#fffdf8; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px rgba(60,50,20,.08);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17150f; --panel:#211e16; --ink:#f0ebdd; --muted:#a39c8a; --line:#3a3528;
    --ok:#5fd18d; --ok-bg:#183b29; --err:#ff8070; --err-bg:#4a211c; --warn:#f0b955; --warn-bg:#4a3a14;
    --accent:#f0ebdd; --accent-ink:#17150f; --shadow:none; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:var(--safe-t);padding-bottom:calc(76px + var(--safe-b))}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 16px 6px;max-width:720px;margin:0 auto}
h1{margin:0;font-size:22px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px}
h2{font-size:15px;margin:22px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--err)}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.eleve-nom{font-weight:700;font-size:17px}
.solde{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:6px 0 2px}
.solde.du{color:var(--err)} .solde.avance{color:var(--ok)} .solde.zero{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.chip.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.chip.err{color:var(--err);background:var(--err-bg);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.liste .item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.liste .item:first-child{border-top:0}
.item .t{font-weight:600}
.item .m{color:var(--muted);font-size:13px}
.montant{font-weight:700;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + var(--safe-b));z-index:5;justify-content:center;gap:4px}
.tab{flex:1;max-width:200px;border:0;background:none;border-radius:12px;padding:8px 4px;min-height:52px;color:var(--muted);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ic{font-size:20px;line-height:1}
.tab[aria-selected="true"]{color:var(--ink);background:var(--bg)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form.f{padding:18px;display:grid;gap:12px}
form.f h3{margin:0 0 2px;font-size:18px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;min-height:44px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg label{flex:1;display:block;text-align:center;padding:10px;cursor:pointer;color:var(--ink);font-size:15px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + span{font-weight:800}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
#login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.err-msg{color:var(--err);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw}
iframe#dash{width:100%;border:0;border-radius:16px;background:var(--panel);min-height:calc(100vh - 170px)}
.hide{display:none!important}
@media (prefers-reduced-motion: no-preference){ .card{transition:transform .12s} .card:active{transform:scale(.995)} }
</style>
</head>
<body>

<section id="login" class="hide" aria-label="Connexion">
  <h1>Mes cours</h1>
  <p class="sub">Paiements, cours et suivi. Connexion réservée à Paul.</p>
  <form id="loginForm" class="card f" autocomplete="on">
    <label>Adresse e-mail<input id="email" type="email" autocomplete="username" required inputmode="email"></label>
    <label>Mot de passe<input id="mdp" type="password" autocomplete="current-password" required></label>
    <div class="err-msg" id="loginErr" role="alert"></div>
    <button class="btn primary" type="submit">Se connecter</button>
  </form>
</section>

<div id="app" class="hide">
  <header class="top">
    <div>
      <h1 id="titre">Paiements</h1>
      <div class="sub" id="sousTitre"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn small" id="btnRegl" aria-label="Réglages des tarifs">⚙︎ Tarifs</button>
      <button class="btn small" id="btnOut" aria-label="Se déconnecter">Quitter</button>
    </div>
  </header>

  <main class="wrap">
    <section id="p-paiements" role="tabpanel">
      <div id="soldes"></div>
      <div class="row" style="margin-top:8px">
        <h2 style="margin:0">Derniers paiements</h2>
        <button class="btn primary small" id="btnPaie">+ Paiement</button>
      </div>
      <div class="card liste" id="listePaie"></div>
    </section>

    <section id="p-cours" role="tabpanel" class="hide">
      <div class="row">
        <h2 style="margin:0">Cours</h2>
        <button class="btn primary small" id="btnCours">+ Cours</button>
      </div>
      <p class="sub" style="margin:8px 0 0">Les cours du calendrier arrivent tout seuls depuis ton Mac. Un cours passé compte comme donné, sauf si tu le marques « annulé » ou « offert ».</p>
      <div class="card liste" id="listeCours"></div>
    </section>

    <section id="p-bord" role="tabpanel" class="hide">
      <div class="sub" id="bordInfo" style="margin-bottom:8px"></div>
      <iframe id="dash" title="Salle de contrôle" sandbox="allow-scripts"></iframe>
    </section>
  </main>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-p="paiements" aria-selected="true"><span class="ic">€</span>Paiements</button>
    <button class="tab" role="tab" data-p="cours" aria-selected="false"><span class="ic">📅</span>Cours</button>
    <button class="tab" role="tab" data-p="bord" aria-selected="false"><span class="ic">🧭</span>Tableau de bord</button>
  </nav>
</div>

<dialog id="dlgPaie"><form class="f" method="dialog" id="fPaie">
  <h3>Nouveau paiement</h3>
  <label>Élève<select id="paieEleve" required></select></label>
  <div class="two">
    <label>Montant (€)<input id="paieMontant" type="number" inputmode="decimal" min="0.01" step="0.01" required></label>
    <label>Date<input id="paieDate" type="date" required></label>
  </div>
  <div class="seg" role="radiogroup" aria-label="Type de paiement">
    <label><input type="radio" name="paieType" value="apres" checked><span>Après les cours</span></label>
    <label><input type="radio" name="paieType" value="avance"><span>D'avance</span></label>
  </div>
  <label>Moyen<select id="paieMode"><option value="">—</option><option>Virement</option><option>Espèces</option><option>Chèque</option><option>Lydia / PayPal</option><option>Autre</option></select></label>
  <label>Note (facultatif)<input id="paieNote" type="text" maxlength="200"></label>
  <div class="err-msg" id="paieErr" role="alert"></div>
  <div class="actions"><button class="btn" type="button" data-close>Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div>
</form></dialog>

<dialog id="dlgCours"><form class="f" method="dialog" id="fCours">
  <h3 id="coursTitre">Nouveau cours</h3>
  <label>Élève<select id="coursEleve" required></select></label>
  <div class="two">
    <label>Date et heure<input id="coursDebut" type="datetime-local" required></label>
    <label>Durée (min)<input id="coursDuree" type="number" inputmode="numeric" min="15" step="15" value="60" required></label>
  </div>
  <label>Statut<select id="coursStatut"><option value="fait">Donné</option><option value="prevu">Prévu</option><option value="annule">Annulé</option></select></label>
  <label style="display:flex;gap:10px;align-items:center;grid-template-columns:none"><input id="coursFacture" type="checkbox" checked style="width:auto;min-height:auto"> Facturé (décoche pour un cours offert)</label>
  <label>Montant particulier (€, facultatif : remplace le tarif)<input id="coursMontant" type="number" inputmode="decimal" min="0" step="0.01"></label>
  <label>Note (facultatif)<input id="coursNote" type="text" maxlength="200"></label>
  <div class="err-msg" id="coursErr" role="alert"></div>
  <div class="actions">
    <button class="btn danger" type="button" id="coursSuppr">Supprimer</button>
    <button class="btn" type="button" data-close>Annuler</button><button class="btn primary" type="submit">Enregistrer</button>
  </div>
</form></dialog>

<dialog id="dlgRegl"><form class="f" method="dialog" id="fRegl">
  <h3>Tarifs et payeurs</h3>
  <div id="reglListe" style="display:grid;gap:14px"></div>
  <div class="err-msg" id="reglErr" role="alert"></div>
  <div class="actions"><button class="btn" type="button" data-close>Fermer</button><button class="btn primary" type="submit">Enregistrer</button></div>
</form></dialog>

<div id="toast" class="toast hide" role="status"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm";

const SUPABASE_URL = "https://zohqpnheexueitjohpet.supabase.co";
const SUPABASE_KEY = "sb_publishable_3dcCmqwWQ7cZlo4VeBSSog_0xKHLY-U"; // clé publique : seule la connexion de Paul ouvre les données
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const $ = (s) => document.querySelector(s);
const eur = (c) => (c / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const jour = (d) => new Date(d).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const heure = (d) => new Date(d).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const aujourdhui = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const versLocal = (d) => new Date(new Date(d).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);

let eleves = [], soldes = [], paiements = [], cours = [], coursEdit = null;

function toast(t) {
  const el = $("#toast"); el.textContent = t; el.classList.remove("hide");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hide"), 2600);
}

/* ───────── connexion ───────── */
async function demarrer() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { afficherApp(); await tout(); } else { $("#login").classList.remove("hide"); $("#app").classList.add("hide"); }
}
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#mdp").value });
  if (error) { $("#loginErr").textContent = "Connexion refusée : vérifie l'adresse et le mot de passe."; return; }
  $("#mdp").value = ""; $("#login").classList.add("hide"); afficherApp(); await tout();
});
$("#btnOut").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
function afficherApp() { $("#login").classList.add("hide"); $("#app").classList.remove("hide"); }

/* ───────── données ───────── */
async function tout() {
  const [e, s, p, c] = await Promise.all([
    sb.from("eleves").select("*").order("nom"),
    sb.from("soldes").select("*").order("nom"),
    sb.from("paiements").select("*").order("date", { ascending: false }).order("cree_le", { ascending: false }).limit(40),
    sb.from("cours").select("*").order("debut", { ascending: false }).limit(60),
  ]);
  const err = e.error || s.error || p.error || c.error;
  if (err) { toast("Erreur de chargement : " + err.message); return; }
  eleves = e.data; soldes = s.data; paiements = p.data; cours = c.data;
  dessinerPaiements(); dessinerCours(); remplirSelects();
}
const nomEleve = (id) => eleves.find((x) => x.id === id)?.nom ?? id;

/* ───────── paiements ───────── */
function dessinerPaiements() {
  const el = $("#soldes");
  if (!soldes.length) { el.innerHTML = `<div class="card empty">Aucun élève.</div>`; return; }
  el.innerHTML = soldes.map((s) => {
    const el_ = eleves.find((x) => x.id === s.eleve_id) || {};
    const sansTarif = el_.tarif_cents == null;
    let classe = "zero", texte = "À jour";
    if (s.solde_cents < 0) { classe = "du"; texte = `On te doit ${eur(-s.solde_cents)}`; }
    else if (s.solde_cents > 0) { classe = "avance"; texte = `${eur(s.solde_cents)} d'avance`; }
    const prixCours = !sansTarif ? (el_.tarif_unite === "cours" ? el_.tarif_cents : el_.tarif_cents) : 0;
    let extra = "";
    if (s.solde_cents > 0 && !sansTarif && prixCours > 0 && el_.tarif_unite === "heure") {
      const h = s.solde_cents / prixCours; extra = `≈ ${h.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} h payée(s) d'avance`;
    } else if (s.solde_cents > 0 && !sansTarif && prixCours > 0 && el_.tarif_unite === "cours") {
      extra = `≈ ${Math.floor(s.solde_cents / prixCours)} cours payé(s) d'avance`;
    }
    return `<div class="card"><div class="row"><div class="eleve-nom">${esc(s.nom)}</div>
      <button class="btn small" data-paie="${esc(s.eleve_id)}">+ Paiement</button></div>
      <div class="solde ${classe}">${esc(texte)}</div>
      <div class="sub">${esc(extra)}</div>
      <div class="chips"><span class="chip">Dû : ${eur(s.du_cents)}</span><span class="chip ok">Reçu : ${eur(s.recu_cents)}</span>
      <span class="chip">${s.nb_cours_factures} cours · ${Number(s.heures_facturees)} h</span>
      ${sansTarif ? `<span class="chip warn">Tarif non renseigné : ouvre « ⚙︎ Tarifs »</span>` : `<span class="chip">${eur(el_.tarif_cents)} / ${el_.tarif_unite === "cours" ? "cours" : "heure"}</span>`}
      ${el_.payeur ? `<span class="chip">${esc(el_.payeur)}</span>` : ""}</div></div>`;
  }).join("");
  $("#sousTitre").textContent = "";
  const l = $("#listePaie");
  l.innerHTML = paiements.length ? paiements.map((p) => `<div class="item"><div><div class="t">${esc(nomEleve(p.eleve_id))} · ${p.type === "avance" ? "d'avance" : "après cours"}</div>
    <div class="m">${jour(p.date)}${p.mode ? " · " + esc(p.mode) : ""}${p.note ? " · " + esc(p.note) : ""}</div></div>
    <div style="text-align:right"><div class="montant">${eur(p.montant_cents)}</div><button class="btn small danger" data-suppr-paie="${p.id}" aria-label="Supprimer ce paiement">Supprimer</button></div></div>`).join("")
    : `<div class="empty">Aucun paiement enregistré.</div>`;
}
$("#soldes").addEventListener("click", (e) => { const b = e.target.closest("[data-paie]"); if (b) ouvrirPaiement(b.dataset.paie); });
$("#btnPaie").addEventListener("click", () => ouvrirPaiement());
$("#listePaie").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-suppr-paie]"); if (!b) return;
  if (!confirm("Supprimer ce paiement ? Le solde sera recalculé.")) return;
  const { error } = await sb.from("paiements").delete().eq("id", b.dataset.supprPaie);
  if (error) toast("Erreur : " + error.message); else { toast("Paiement supprimé"); await tout(); }
});
function ouvrirPaiement(eleveId) {
  $("#paieErr").textContent = ""; $("#fPaie").reset();
  if (eleveId) $("#paieEleve").value = eleveId;
  $("#paieDate").value = aujourdhui(); $("#dlgPaie").showModal();
}
$("#fPaie").addEventListener("submit", async (e) => {
  e.preventDefault();
  const montant = Math.round(parseFloat(String($("#paieMontant").value).replace(",", ".")) * 100);
  if (!(montant > 0)) { $("#paieErr").textContent = "Montant invalide."; return; }
  const { error } = await sb.from("paiements").insert({
    eleve_id: $("#paieEleve").value, montant_cents: montant, date: $("#paieDate").value,
    type: document.querySelector('input[name="paieType"]:checked').value,
    mode: $("#paieMode").value || null, note: $("#paieNote").value.trim() || null });
  if (error) { $("#paieErr").textContent = "Erreur : " + error.message; return; }
  $("#dlgPaie").close(); toast("Paiement enregistré"); await tout();
});

/* ───────── cours ───────── */
function dessinerCours() {
  const l = $("#listeCours");
  const maintenant = Date.now();
  l.innerHTML = cours.length ? cours.map((c) => {
    const passe = new Date(c.debut).getTime() < maintenant;
    let etat = c.statut === "annule" ? `<span class="chip err">Annulé</span>`
      : !c.facture ? `<span class="chip warn">Offert</span>`
      : (c.statut === "fait" || passe) ? `<span class="chip ok">Donné</span>` : `<span class="chip">Prévu</span>`;
    return `<button class="item" style="width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit" data-cours="${c.id}">
      <div><div class="t">${esc(nomEleve(c.eleve_id))}</div><div class="m">${jour(c.debut)} · ${heure(c.debut)} · ${c.duree_min} min${c.note ? " · " + esc(c.note) : ""}</div></div>
      <div style="text-align:right">${etat}${c.montant_cents != null ? `<div class="m">${eur(c.montant_cents)}</div>` : ""}</div></button>`;
  }).join("") : `<div class="empty">Aucun cours pour l'instant. Ils arrivent depuis ton calendrier à la prochaine synchro du Mac.</div>`;
}
$("#listeCours").addEventListener("click", (e) => { const b = e.target.closest("[data-cours]"); if (b) ouvrirCours(cours.find((c) => c.id === b.dataset.cours)); });
$("#btnCours").addEventListener("click", () => ouvrirCours(null));
function ouvrirCours(c) {
  coursEdit = c; $("#coursErr").textContent = ""; $("#fCours").reset();
  $("#coursTitre").textContent = c ? "Modifier le cours" : "Nouveau cours";
  $("#coursSuppr").classList.toggle("hide", !c);
  if (c) {
    $("#coursEleve").value = c.eleve_id; $("#coursDebut").value = versLocal(c.debut); $("#coursDuree").value = c.duree_min;
    $("#coursStatut").value = c.statut; $("#coursFacture").checked = c.facture;
    $("#coursMontant").value = c.montant_cents != null ? (c.montant_cents / 100).toString() : ""; $("#coursNote").value = c.note || "";
  } else { $("#coursDebut").value = versLocal(new Date()); $("#coursStatut").value = "fait"; }
  $("#dlgCours").showModal();
}
$("#fCours").addEventListener("submit", async (e) => {
  e.preventDefault();
  const m = String($("#coursMontant").value).trim();
  const ligne = { eleve_id: $("#coursEleve").value, debut: new Date($("#coursDebut").value).toISOString(),
    duree_min: parseInt($("#coursDuree").value, 10), statut: $("#coursStatut").value, facture: $("#coursFacture").checked,
    montant_cents: m === "" ? null : Math.round(parseFloat(m.replace(",", ".")) * 100), note: $("#coursNote").value.trim() || null };
  const r = coursEdit ? await sb.from("cours").update(ligne).eq("id", coursEdit.id) : await sb.from("cours").insert({ ...ligne, source: "manuel" });
  if (r.error) { $("#coursErr").textContent = "Erreur : " + r.error.message; return; }
  $("#dlgCours").close(); toast("Cours enregistré"); await tout();
});
$("#coursSuppr").addEventListener("click", async () => {
  if (!coursEdit || !confirm("Supprimer ce cours ? (S'il vient du calendrier, préfère « Annulé » : il ne reviendrait pas.)")) return;
  const { error } = await sb.from("cours").delete().eq("id", coursEdit.id);
  if (error) { $("#coursErr").textContent = "Erreur : " + error.message; return; }
  $("#dlgCours").close(); toast("Cours supprimé"); await tout();
});

/* ───────── tarifs ───────── */
$("#btnRegl").addEventListener("click", () => {
  $("#reglErr").textContent = "";
  $("#reglListe").innerHTML = eleves.map((e) => `<div class="card" style="margin:0" data-regl="${esc(e.id)}"><div class="eleve-nom">${esc(e.nom)}</div>
    <div class="two" style="margin-top:8px"><label>Tarif (€)<input data-f="tarif" type="number" inputmode="decimal" min="0" step="0.01" value="${e.tarif_cents != null ? e.tarif_cents / 100 : ""}"></label>
    <label>Par<select data-f="unite"><option value="heure"${e.tarif_unite === "heure" ? " selected" : ""}>heure</option><option value="cours"${e.tarif_unite === "cours" ? " selected" : ""}>cours</option></select></label></div>
    <label style="margin-top:8px">Qui paie<input data-f="payeur" type="text" maxlength="80" value="${esc(e.payeur || "")}" placeholder="Parents, l'élève…"></label></div>`).join("");
  $("#dlgRegl").showModal();
});
$("#fRegl").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  for (const bloc of document.querySelectorAll("[data-regl]")) {
    const t = bloc.querySelector('[data-f="tarif"]').value.trim();
    const { error } = await sb.from("eleves").update({
      tarif_cents: t === "" ? null : Math.round(parseFloat(t.replace(",", ".")) * 100),
      tarif_unite: bloc.querySelector('[data-f="unite"]').value, payeur: bloc.querySelector('[data-f="payeur"]').value.trim() || null,
    }).eq("id", bloc.dataset.regl);
    if (error) { $("#reglErr").textContent = "Erreur : " + error.message; return; }
  }
  $("#dlgRegl").close(); toast("Tarifs enregistrés"); await tout();
});

function remplirSelects() {
  const opts = eleves.filter((e) => e.actif).map((e) => `<option value="${esc(e.id)}">${esc(e.nom)}</option>`).join("");
  $("#paieEleve").innerHTML = opts; $("#coursEleve").innerHTML = opts;
}

/* ───────── tableau de bord (instantané poussé par le Mac) ───────── */
let modeleDash = null;
async function chargerDash() {
  const { data, error } = await sb.from("instantanes").select("*").eq("cle", "dashboard").maybeSingle();
  const info = $("#bordInfo");
  if (error) { info.textContent = "Erreur : " + error.message; return; }
  if (!data) { info.textContent = "Pas encore de données : le Mac les envoie à chaque passage de surveillance."; $("#dash").srcdoc = ""; return; }
  if (!modeleDash) modeleDash = await (await fetch("dashboard-modele.html", { cache: "no-cache" })).text();
  const d = { ...data.donnees, genere: data.maj };
  const html = modeleDash
    .replace(/<script>if\(!location[^<]*<\/script>/, "")
    .replace('const SNAP = location.search.includes("snap");', "const SNAP = true;")
    .replace("/*DATA*/null", JSON.stringify(d).replace(/</g, "\\u003c"));
  $("#dash").srcdoc = html;
  info.textContent = "Dernier état envoyé par ton Mac : " + new Date(data.maj).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
}

/* ───────── onglets ───────── */
const titres = { paiements: "Paiements", cours: "Cours", bord: "Tableau de bord" };
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  const p = t.dataset.p;
  document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === t)));
  ["paiements", "cours", "bord"].forEach((n) => $("#p-" + n).classList.toggle("hide", n !== p));
  $("#titre").textContent = titres[p];
  if (p === "bord") chargerDash(); else tout();
}));
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#app").classList.contains("hide")) tout(); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
demarrer();
</script>
</body>
</html>
